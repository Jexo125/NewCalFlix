name: Build NewCalFlix Android

on:
  push:
    tags:
      - "v*"
    branches:
      - main
      - master
      - develop
  pull_request:
    paths:
      - pubspec.yaml
      - .github/workflows/build.yml
      - .fvmrc
    types:
      - opened
      - reopened
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type (release, nightly)"
        required: false
        default: "nightly"
        type: choice
        options:
          - release
          - nightly

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NIGHTLY_TAG: nightly

jobs:
  check-trigger:
    runs-on: ubuntu-latest
    outputs:
      build_type: ${{ steps.check.outputs.build_type }}
    steps:
      - name: Determine build type
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            BUILD_TYPE="${{ github.event.inputs.build_type }}"
          elif [[ "${{ startsWith(github.ref, 'refs/tags/v') }}" == "true" ]]; then
            BUILD_TYPE="release"
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            BUILD_TYPE="nightly"
          else
            BUILD_TYPE="development"
          fi

          echo "build_type=${BUILD_TYPE}" >> $GITHUB_OUTPUT
          echo "Build type determined: ${BUILD_TYPE}"

  fetch-info:
    needs: [check-trigger]
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.fetch.outputs.version_name }}
      flutter_version: ${{ steps.fetch.outputs.flutter_version }}
      nightly_version: ${{ steps.fetch.outputs.nightly_version }}
      build_type: ${{ needs.check-trigger.outputs.build_type }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0

      - name: Fetch version name and create nightly version
        id: fetch
        run: |
          VERSION_NAME=$(grep '^version:' pubspec.yaml | cut -d ':' -f2 | cut -d '+' -f1 | tr -d ' ')
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"

          if [ -f .fvmrc ]; then
            FLUTTER_VERSION=$(jq -r '.flutter' .fvmrc 2>/dev/null || echo "3.47.0")
          else
            FLUTTER_VERSION="3.47.0"
          fi
          echo "flutter_version=${FLUTTER_VERSION}" >> "$GITHUB_OUTPUT"

          if [[ "${{ needs.check-trigger.outputs.build_type }}" == "nightly" ]]; then
            NIGHTLY_VERSION="${VERSION_NAME}-nightly"
            echo "nightly_version=${NIGHTLY_VERSION}" >> "$GITHUB_OUTPUT"
            echo "Nightly version: $NIGHTLY_VERSION"
          fi

          echo "Base version: $VERSION_NAME"
          echo "Flutter version: $FLUTTER_VERSION"
        shell: bash

  build-android:
    needs: [fetch-info]
    runs-on: ubuntu-latest
    outputs:
      artifact_suffix: ${{ env.ARTIFACT_SUFFIX }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.1.1

      - name: Determine Build Type
        run: |
          echo "ARTIFACT_SUFFIX=${{ needs.fetch-info.outputs.build_type }}" >> $GITHUB_ENV
          echo "ARTIFACT_SUFFIX=${{ needs.fetch-info.outputs.build_type }}" >> $GITHUB_OUTPUT

      - name: Decode Keystore for release
        if: needs.fetch-info.outputs.build_type != 'development'
        env:
          ENCODED_STRING: ${{ secrets.NEWCALFLIX_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.NEWCALFLIX_KEYSTORE_PASSWORD }}
          RELEASE_KEYSTORE_ALIAS: ${{ secrets.NEWCALFLIX_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.NEWCALFLIX_KEY_PASSWORD }}
        run: |
          if [ -n "$ENCODED_STRING" ]; then
            echo "$ENCODED_STRING" | base64 -d > android/app/keystore.jks
            echo "storePassword=$RELEASE_KEYSTORE_PASSWORD" > android/app/key.properties
            echo "keyPassword=$RELEASE_KEY_PASSWORD" >> android/app/key.properties
            echo "keyAlias=$RELEASE_KEYSTORE_ALIAS" >> android/app/key.properties
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"
          check-latest: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.19.0
        with:
          channel: "stable"
          flutter-version: ${{needs.fetch-info.outputs.flutter_version}}
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"
          cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:"

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android Universal & Split Debug APKs (PRs / Dev)
        if: needs.fetch-info.outputs.build_type == 'development'
        run: |
          flutter build apk --debug --build-number=${{github.run_number}} --flavor production
          flutter build apk --debug --split-per-abi --build-number=${{github.run_number}} --flavor production

      - name: Build Android Universal & Split Release APKs and AAB
        if: needs.fetch-info.outputs.build_type != 'development'
        run: |
          flutter build apk --release --build-number=${{github.run_number}} --flavor production
          flutter build apk --release --split-per-abi --build-number=${{github.run_number}} --flavor production
          flutter build appbundle --release --build-number=${{github.run_number}} --flavor production

      - name: Organize Android Artifacts
        run: |
          mkdir -p build/app/outputs/android_artifacts
          PREFIX="NewCalFlix-Android-${{ needs.fetch-info.outputs.version_name }}"
          if [ "${{ needs.fetch-info.outputs.build_type }}" = "development" ]; then
            cp build/app/outputs/flutter-apk/app-production-debug.apk build/app/outputs/android_artifacts/${PREFIX}-universal-debug.apk || true
            cp build/app/outputs/flutter-apk/app-armeabi-v7a-production-debug.apk build/app/outputs/android_artifacts/${PREFIX}-armeabi-v7a-debug.apk || true
            cp build/app/outputs/flutter-apk/app-arm64-v8a-production-debug.apk build/app/outputs/android_artifacts/${PREFIX}-arm64-v8a-debug.apk || true
            cp build/app/outputs/flutter-apk/app-x86_64-production-debug.apk build/app/outputs/android_artifacts/${PREFIX}-x86_64-debug.apk || true
          else
            cp build/app/outputs/flutter-apk/app-production-release.apk build/app/outputs/android_artifacts/${PREFIX}-universal.apk || true
            cp build/app/outputs/flutter-apk/app-armeabi-v7a-production-release.apk build/app/outputs/android_artifacts/${PREFIX}-armeabi-v7a.apk || true
            cp build/app/outputs/flutter-apk/app-arm64-v8a-production-release.apk build/app/outputs/android_artifacts/${PREFIX}-arm64-v8a.apk || true
            cp build/app/outputs/flutter-apk/app-x86_64-production-release.apk build/app/outputs/android_artifacts/${PREFIX}-x86_64.apk || true
            cp build/app/outputs/bundle/productionRelease/app-production-release.aab build/app/outputs/android_artifacts/${PREFIX}.aab || true
          fi

      - name: Archive Android artifacts
        uses: actions/upload-artifact@v4.0.0
        with:
          name: newcalflix-android
          path: build/app/outputs/android_artifacts/

  create_release:
    name: Create GitHub Release
    needs:
      - fetch-info
      - build-android
    runs-on: ubuntu-latest
    if: needs.fetch-info.outputs.build_type == 'release' || needs.fetch-info.outputs.build_type == 'nightly'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        if: needs.fetch-info.outputs.build_type == 'nightly'
        uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0

      - name: Set version variables
        id: version
        run: |
          if [[ "${{ needs.fetch-info.outputs.build_type }}" == "nightly" ]]; then
            echo "version=${{ needs.fetch-info.outputs.nightly_version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ needs.fetch-info.outputs.version_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Delete existing nightly release
        if: needs.fetch-info.outputs.build_type == 'nightly'
        run: |
          if gh release view ${{ env.NIGHTLY_TAG }} >/dev/null 2>&1; then
            gh release delete ${{ env.NIGHTLY_TAG }} --yes --cleanup-tag
          fi
          if git tag -l | grep -q "^${{ env.NIGHTLY_TAG }}$"; then
            git push origin --delete ${{ env.NIGHTLY_TAG }} || true
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate changelog
        if: needs.fetch-info.outputs.build_type == 'nightly'
        id: changelog
        run: |
          LATEST_STABLE_RELEASE=$(gh release list --limit 50 --exclude-drafts --json tagName,isPrerelease --jq '.[] | select(.isPrerelease == false) | .tagName' | head -1 || echo "")
          cat > changelog.md <<-EOF
          # $(date -u "+%Y-%m-%d %H:%M:%S UTC")

          Automated nightly build for NewCalFlix Android.

          **⚠️ Warning:** Development build containing latest changes from the develop branch.

          ## 📋 What's Changed
          EOF

          if [ -n "$LATEST_STABLE_RELEASE" ]; then
            echo "[Compare $LATEST_STABLE_RELEASE...HEAD](https://github.com/${{ github.repository }}/compare/$LATEST_STABLE_RELEASE...HEAD)" >> changelog.md
          else
            echo "[View commits](https://github.com/${{ github.repository }}/commits/develop)" >> changelog.md
          fi

          echo "changelog_file=changelog.md" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: newcalflix-android
          path: newcalflix-android

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2.2.2
        with:
          tag_name: ${{ needs.fetch-info.outputs.build_type == 'nightly' && env.NIGHTLY_TAG || github.ref_name }}
          name: ${{ needs.fetch-info.outputs.build_type == 'nightly' && format('🌙 NewCalFlix Nightly - {0}', steps.version.outputs.version) || format('NewCalFlix v{0}', steps.version.outputs.version) }}
          body_path: ${{ needs.fetch-info.outputs.build_type == 'nightly' && 'changelog.md' || '' }}
          draft: ${{ needs.fetch-info.outputs.build_type == 'release' }}
          prerelease: ${{ needs.fetch-info.outputs.build_type == 'nightly' }}
          make_latest: ${{ needs.fetch-info.outputs.build_type == 'release' }}
          generate_release_notes: ${{ needs.fetch-info.outputs.build_type == 'release' }}
          fail_on_unmatched_files: false
          files: newcalflix-android/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
